<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vibe Sorter</title>
    <link rel="stylesheet" href="/web/review.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <h1>Vibe Sorter</h1>
        <span id="summary" class="muted"></span>
    </div>
    <a id="login-link" class="btn btn-primary" href="/login" hidden>Log in with Spotify</a>
</header>

<div class="layout">
    <aside class="sidebar">
        <button class="pl-item active" data-vibe="">All playlists <span class="count" id="all-count"></span></button>
        <div id="playlist-list"></div>
    </aside>

    <main>
        <div class="toolbar">
            <div class="tabs" id="tabs">
                <button data-view="pending" class="active">Pending <span class="count"></span></button>
                <button data-view="approved">Approved <span class="count"></span></button>
                <button data-view="declined">Declined <span class="count"></span></button>
                <button data-view="added">Added <span class="count"></span></button>
            </div>
            <div class="toolbar-row">
                <input id="search" type="search" placeholder="Search title, artist, album  ( / )">
                <select id="sort">
                    <option value="score">Best fit first</option>
                    <option value="added">Recently liked first</option>
                </select>
                <button class="btn" id="approve-page" title="Approve every pending suggestion shown">Approve all shown</button>
                <button class="btn" id="decline-page" title="Decline every pending suggestion shown">Decline all shown</button>
            </div>
            <p id="filter-desc" class="muted filter-desc"></p>
        </div>

        <div id="cards"></div>
        <div class="more">
            <button class="btn" id="load-more" hidden>Load more</button>
            <p id="empty" class="muted" hidden></p>
        </div>
    </main>
</div>

<footer class="hotkeys">
    <span><kbd>j</kbd>/<kbd>k</kbd> next/prev song</span>
    <span><kbd>1</kbd>–<kbd>9</kbd> approve suggestion</span>
    <span><kbd>Shift</kbd>+<kbd>1</kbd>–<kbd>9</kbd> decline</span>
    <span><kbd>a</kbd> approve rest</span>
    <span><kbd>d</kbd> decline rest</span>
    <span><kbd>z</kbd> undo</span>
</footer>
<div id="toast" class="toast" hidden></div>

<script src="/web/review.js"></script>
</body>
</html>
